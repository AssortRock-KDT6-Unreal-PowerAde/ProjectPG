[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; UnrealMCPython's dispatcher (mcp_unreal_actions.execute_action) imports action
; modules as top-level names, e.g. importlib.import_module("util_actions"). The
; Python plugin only auto-registers <PluginContent>/Python on sys.path, not the
; UnrealMCPython/ subfolder those modules live in, so every python_call fails
; with ModuleNotFoundError unless that subfolder is added explicitly.
; AdditionalPaths only accepts absolute paths, which broke the bridge on every
; machine whose checkout was not on the drive it was authored from, so the path
; is now derived at startup instead - see Content/Python/init_unreal.py.

[ConsoleVariables]
; The imported environment packs currently require roughly 725 MiB at the
; test-map camera. 600 MiB caused a persistent 73-124 MiB over-budget warning.
; Keep one GiB of bounded headroom rather than globally forcing lower-quality
; mips; r.Streaming.LimitPoolSizeToVRAM remains enabled by the renderer.
r.Streaming.PoolSize=2048
r.Streaming.MaxTempMemoryAllowed=100
